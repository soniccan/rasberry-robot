version: 2.1
name: Deploy to Cloud Run

orbs:
  terraform: circleci/terraform@2.1.0
  slack: circleci/slack@3.4.2
  go: circleci/go@3.0.0
  gcp-cli: circleci/gcp-cli@3.1
  gcp-gcr: circleci/gcp-gcr@0.16.10
  docker: circleci/docker@2.2.0

executors:
  docker-executor:
    docker:
      - image: cimg/base:current
        user: root
  go-executor:
    docker:
      - image: cimg/go:1.24
  go-test-build-executor:
    docker:
      - image: cimg/go:1.24
on:
  push:
    branches:
      - main
commands:
  go-vet:
    steps:
      - run:
          name: Go Vet
          command: |
            go vet ./...
  setup-gcp:
    steps:
      - gcp-cli/setup:
          version: 404.0.0
          use_oidc: true

jobs:
  deploy-user-api:
    working_directory: ~/user-api
    executor: gcp-gcr/default
    steps:
      - checkout
      - go-vet
      - setup-gcp
      - gcp-gcr/gcr-auth:
          use_oidc: true
      - gcp-gcr/build-image:
          image: rasberry-robot/user-api
          registry-url: gcr.io
      - gcp-gcr/push-image:
          digest-path: /tmp/digest.txt
          image: rasberry-robot/user-api
          registry-url: gcr.io
      - run:
          command: |
            echo "Digest: $(cat /tmp/digest.txt)"
  deploy-rasberry-robot:
    working_directory: ~/rasberry-robot
    executor: gcp-cli/default
    steps:
      - checkout
      - setup-gcp
workflows:
  version: 2
  deploy-workflow:
    jobs:
      - deploy-user-api:
          name: Build and Push User API Image
          filters:
            branches:
              only: master
      - deploy-rasberry-robot:
          name: Deploy Raspberry Robot
          filters:
            branches:
              only: master
